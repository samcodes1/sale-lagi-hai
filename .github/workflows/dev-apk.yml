name: Dev APK

# Builds a debug dev APK for manual testing and keeps it for 3 days. Runs only
# on this branch, so it never affects main.
on:
  push:
    branches: [fix/android-gradle-build]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  build-dev-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: cp env/dev.example.json env/dev.json
      - run: flutter pub get
      - run: >-
          flutter build apk --debug
          --flavor dev
          --dart-define-from-file=env/dev.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-dev-debug
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          if-no-files-found: error
          retention-days: 3
