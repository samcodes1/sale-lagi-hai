name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
# Actions are pinned to full commit SHAs (tags can be moved); the comment
# gives the version for updates.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks reads the PR's commits when scanning pull requests.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # .gitleaks.toml uses [[allowlists]], which needs gitleaks 8.25+;
          # the action's default is older.
          GITLEAKS_VERSION: "8.30.1"

  # Known vulnerabilities in the locked dependencies (OSV database), plus
  # pub.dev's own checks: advisories, retracted versions, discontinued or
  # banned packages and non-pub.dev sources (tool/audit_deps.dart).
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pubspec.lock
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/audit_deps.dart pubspec.lock --online

  # Migrations from zero, the schema lint and the pgTAP tests, on a
  # throwaway Postgres (tool/db_test.sh).
  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Postgres 16 with PostGIS, pgTAP and pg_cron
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-postgis-3 \
            postgresql-16-pgtap postgresql-16-cron
      - run: tool/db_test.sh

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Generated code (routes, l10n) is committed; fail if it is stale.
      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code -- '*.g.dart' lib/l10n/gen \
            || { echo "::error::Generated code is stale. Run build_runner and gen-l10n, then commit."; exit 1; }
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --coverage
      # bootstrap()'s success path only runs with a compiled-in config.
      - name: Bootstrap with a real config
        run: |
          cp env/dev.example.json env/dev.json
          flutter test test/qa/bootstrap_qa_test.dart \
            --dart-define-from-file=env/dev.json
      - name: Coverage threshold
        run: dart run tool/check_coverage.dart coverage/lcov.info --min 80
      - name: Env templates are valid
        run: |
          for flavor in dev staging prod; do
            dart run tool/check_env.dart env/$flavor.example.json \
              --flavor $flavor --allow-placeholders
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info

  build-android:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [dev, staging, prod]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # CI builds with the public example configs; real env files never
      # live in the repository. Release builds must not pass
      # --allow-placeholders.
      - run: cp env/${{ matrix.flavor }}.example.json env/${{ matrix.flavor }}.json
      - run: >-
          dart run tool/check_env.dart env/${{ matrix.flavor }}.json
          --flavor ${{ matrix.flavor }} --allow-placeholders
      - run: >-
          flutter build apk --debug
          --flavor ${{ matrix.flavor }}
          --dart-define-from-file=env/${{ matrix.flavor }}.json

  # A release build exercises R8 (shrinking and obfuscation) and Dart
  # obfuscation, which debug builds skip. It is signed with the debug key
  # (no secrets in CI yet) and is not uploaded; see docs/RELEASE.md.
  build-android-release:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: cp env/prod.example.json env/prod.json
      - run: >-
          flutter build appbundle --release
          --flavor prod
          --dart-define-from-file=env/prod.json
          --obfuscate --split-debug-info=build/symbols
      - name: Symbols were split out
        run: test -n "$(ls -A build/symbols)"

  build-web:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: cp env/dev.example.json env/dev.json
      - run: flutter build web --release --dart-define-from-file=env/dev.json
