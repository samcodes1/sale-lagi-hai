name: Release AAB

# Builds the Play Store app bundle (prod flavor, obfuscated) and keeps it with
# its symbols for 7 days, then opens the same release build on an emulator and
# fails if it crashes (R8 only runs in release builds; v1.0.0 was rejected by
# Play for a launch crash the debug builds never showed). The upload key never comes to GitHub: the bundle is
# built with the debug key and the owner signs it with the upload key on
# their own computer (docs/RELEASE.md, "Sign and upload").
on:
  push:
    tags: ['v*']
    branches: ['release/**']
  pull_request:
    paths:
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/release-aab.yml'
      - 'tool/release_smoke_test.sh'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Public values only (the URL and the publishable key). Until a
      # separate prod backend exists, prod uses the live dev backend.
      - name: Prod env
        env:
          SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL || vars.DEV_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.PROD_SUPABASE_PUBLISHABLE_KEY || vars.DEV_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          jq --arg url "$SUPABASE_URL" --arg key "$SUPABASE_PUBLISHABLE_KEY" \
            '.SUPABASE_URL = $url | .SUPABASE_PUBLISHABLE_KEY = $key' \
            env/prod.example.json > env/prod.json
      - run: flutter pub get
      - name: Env is valid for prod (no placeholders, no test ad IDs)
        run: dart run tool/check_env.dart env/prod.json --flavor prod
      - run: >-
          flutter build appbundle --release
          --flavor prod
          --dart-define-from-file=env/prod.json
          --obfuscate --split-debug-info=build/symbols
      # The same release build as an APK (same R8 rules, debug-signed), for
      # the emulator check below and for testing by hand.
      - run: >-
          flutter build apk --release
          --flavor prod
          --dart-define-from-file=env/prod.json
          --obfuscate --split-debug-info=build/symbols-apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-prod-release-apk
          path: build/app/outputs/flutter-apk/app-prod-release.apk
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-prod-release-aab
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: symbols
          path: |
            build/symbols
            build/app/outputs/mapping/prodRelease/mapping.txt
          retention-days: 30

  smoke-test:
    needs: build-aab
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-prod-release-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the release build on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tool/release_smoke_test.sh app-prod-release.apk
