# Supabase CLI config for local development (`supabase start`).
# Hosted projects (dev, staging, prod) are configured in the dashboard;
# keep the security-relevant settings here in sync with them.
project_id = "sale-lagi-hai"

[api]
enabled = true
port = 54321
# Only public is exposed. private and tests are never in this list.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# The most rows one request can return: limits scraping (feeds page by 50).
max_rows = 100

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# Short-lived access tokens; refresh tokens rotate.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.sms]
enable_signup = true
enable_confirmations = true

[auth.email]
enable_signup = false

# Called by pg_cron (pg_net) with x-dispatcher-secret, not a user JWT.
[functions.push-dispatcher]
verify_jwt = false

[functions.ingest]
verify_jwt = false
